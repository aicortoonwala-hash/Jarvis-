name: JARVIS Release APK

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Create release signing key
        working-directory: android
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace
      - name: Rename APK
        working-directory: android
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/JARVIS-SuperAgent.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-super-agent-release
          path: android/app/build/outputs/apk/release/JARVIS-SuperAgent.apk
